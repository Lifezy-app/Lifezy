<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lifezy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lifezy – Haz tu vida más fácil. Guías para ahorrar, estudiar y organizar tus comidas.">
<meta name="theme-color" content="#2350E0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra de prototipo arriba; vista Web (landing de descarga) o vista App (ventana de escritorio con barra lateral) */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EEF2F8; --line:#DCE3EE;
  --fg:#172033; --muted:#5B6780; --accent:#2350E0; --accent-fg:#FFFFFF; --accent-soft:#E3EAFF;
  --ok:#11845B; --ok-soft:#DDF4EA; --warn:#B86E00; --warn-soft:#FFF0D6; --bad:#C8322E; --bad-soft:#FDE3E1;
  --c1:#2350E0; --c2:#F2994A; --c3:#14A37F; --c4:#E0487A; --c5:#8E5BE8; --c6:#E5B300;
  --brand:#FFC21A; --brand-text:#F5B800; --go:#0E9F55; --go-fg:#FFFFFF; --il-aho:#DCE5FF; --il-est:#ECE2FF; --il-menu:#D8F3EA;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --surface:#172033; --surface-2:#1E2940; --line:#2C3A55;
  --fg:#E8EDF7; --muted:#9AA7C0; --accent:#6D8DFF; --accent-fg:#0F1522; --accent-soft:#233463;
  --ok:#4FD1A0; --ok-soft:#173A31; --warn:#FFB84D; --warn-soft:#3D2F14; --bad:#FF7A73; --bad-soft:#44201F;
  --c1:#6D8DFF; --c2:#F7A96A; --c3:#3DCBA3; --c4:#F2709A; --c5:#A88BF5; --c6:#F0CB3A; --brand:#FFC933; --brand-text:#FFC933; --go:#22C36E; --go-fg:#07140D; --il-aho:#1F2C55; --il-est:#2B2352; --il-menu:#173B35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#172033; --surface-2:#1E2940; --line:#2C3A55;
  --fg:#E8EDF7; --muted:#9AA7C0; --accent:#6D8DFF; --accent-fg:#0F1522; --accent-soft:#233463;
  --ok:#4FD1A0; --ok-soft:#173A31; --warn:#FFB84D; --warn-soft:#3D2F14; --bad:#FF7A73; --bad-soft:#44201F;
  --c1:#6D8DFF; --c2:#F7A96A; --c3:#3DCBA3; --c4:#F2709A; --c5:#A88BF5; --c6:#F0CB3A; --brand:#FFC933; --brand-text:#FFC933; --go:#22C36E; --go-fg:#07140D; --il-aho:#1F2C55; --il-est:#2B2352; --il-menu:#173B35; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* barra de prototipo */
.proto-unused{background:var(--fg);color:var(--bg);font-size:13px}
.proto-unused .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:8px}
.proto-unused .seg{display:flex;gap:4px;background:color-mix(in srgb,var(--bg) 15%,transparent);border-radius:8px;padding:3px}
.proto-unused .seg button{border:0;background:transparent;color:var(--bg);padding:4px 12px;border-radius:6px;font-weight:600}
.proto-unused .seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.proto-unused .linkbtn{background:none;border:0;color:var(--bg);text-decoration:underline;opacity:.8}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.msg{padding:9px 12px;border-radius:9px;font-size:14px}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.info{background:var(--accent-soft);color:var(--fg)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ===== Vista WEB ===== */
.web-top{display:flex;justify-content:space-between;align-items:center;padding-block:18px;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-weight:800}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:28px 40px}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--muted);font-size:18px;max-width:52ch;margin:16px 0 24px}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero small{display:block;color:var(--muted);margin-top:12px}
.mock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 50px -25px color-mix(in srgb,var(--fg) 40%,transparent)}
.mock .dots{display:flex;gap:6px;margin-bottom:12px}.mock .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.mock-row{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--surface-2);margin-top:6px;font-size:14px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:8px 40px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px}
.pcard h3{font-size:20px}
.pcard p{color:var(--muted);margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-block:8px 56px}
.step{display:flex;gap:14px}
.step b{font-family:var(--display);font-size:28px;color:var(--accent);line-height:1}
.step h3{font-size:17px;margin-bottom:4px}
.step p{margin:0;color:var(--muted)}
.section-title{font-size:26px;margin-bottom:16px}

/* ===== Vista APP ===== */
.appwin{margin-block:20px 40px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:620px;display:flex;flex-direction:column}
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:13px;color:var(--muted)}
.titlebar .dots{display:flex;gap:6px}.titlebar .dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.titlebar .saved{margin-left:auto;color:var(--ok);font-weight:600}
.center{flex:1;display:grid;place-items:center;padding:32px 16px}
.panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:28px}
.panel p{margin:0;color:var(--muted)}
.langs{display:grid;gap:10px}
.langs button{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px}
.langs button:hover{border-color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:7px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 15%,transparent)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.demo-hint{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.demo-hint code{font-size:12px}

.shell{flex:1;display:grid;grid-template-columns:220px 1fr;min-height:0}
.side{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.side .who{padding:6px 10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:8px;word-break:break-all}
.side .who strong{display:block;color:var(--fg);font-size:14px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;text-align:left;font-weight:600;color:var(--muted)}
.nav .dot{width:9px;height:9px;border-radius:50%;flex:none}
.nav:hover{background:var(--surface-2);color:var(--fg)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--fg)}
.nav .lock{margin-left:auto;font-size:11px;opacity:.7}
.side .spacer{flex:1}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.main{padding:24px;min-width:0;overflow:auto}
.main h2{font-size:26px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted)}

.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ccard h3{font-size:19px}
.ccard p{margin:0;color:var(--muted);font-size:14px;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;width:max-content}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.activate{margin-top:20px;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface-2)}
.activate .field{flex:1;min-width:200px}

.illo{position:relative;border-radius:12px;overflow:hidden;line-height:0}
.illo svg{display:block;max-width:100%;height:auto}
.pcard .sell{color:var(--fg);font-weight:600}
.ccard .sell{color:var(--fg);font-size:13px;font-weight:600}
.ccard.locked .illo{filter:grayscale(1);opacity:.5}
.ccard.locked h3{color:var(--muted)}
.lockbadge{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;line-height:1}
.nav.is-locked .dot{background:var(--line)!important}
.nav.is-locked{opacity:.65}
.hero h1{font-size:clamp(56px,9vw,104px);letter-spacing:.02em}
.tagline{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.4vw,26px)!important;color:var(--accent)!important;margin:4px 0 14px!important}
.start{background:var(--ok-soft);border-radius:18px;padding:24px 22px;margin-bottom:40px}
.start .section-title{color:var(--ok)}
.start .steps{padding:0}
.start .step b{color:var(--ok)}
.sec-head{margin-bottom:16px}.sec-head .section-title{margin-bottom:4px}.sec-head p{margin:0;color:var(--muted);font-size:16px}
.illo-btn{border:0;padding:0;background:none;width:100%;cursor:zoom-in;display:block}
.illo .more{position:absolute;right:10px;bottom:10px;background:var(--surface);color:var(--fg);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;line-height:1.5}
.buy{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.price{font-family:var(--display);font-weight:800;font-size:20px;margin-right:auto}
.gal{max-width:760px!important}
.gal-top{display:flex;justify-content:space-between;align-items:center}
.gal-stage{border-radius:12px;overflow:hidden;background:var(--surface-2);line-height:0}
.gal-stage svg,.gal-stage img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.gal-nav{display:flex;justify-content:space-between;align-items:center}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumbs figure{margin:0;width:120px;position:relative}
.thumbs img{width:120px;height:80px;object-fit:cover;border-radius:8px;display:block}
.thumbs figcaption{font-size:11px;color:var(--muted)}
.thumbs .x{position:absolute;top:4px;right:4px;background:var(--surface)}
/* Ahorra Fácil */
.months{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:600;font-size:13px;color:var(--muted);flex:none}
.months button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.aho{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.box{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface);min-width:0}
.box h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.addrow{display:grid;grid-template-columns:1.1fr 1.4fr .8fr auto;gap:8px;margin-top:12px}
.addrow.inc{grid-template-columns:1.6fr .8fr auto}
.x{border:0;background:transparent;color:var(--muted);padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.ring-wrap{display:grid;place-items:center;position:relative;margin-block:4px 12px}
.ring-center{position:absolute;text-align:center}
.ring-center b{display:block;font-family:var(--display);font-size:24px}
.ring-center span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--surface-2);border-radius:10px;padding:9px 11px}
.kpi span{font-size:12px;color:var(--muted);display:block}
.kpi b{font-size:17px}
.bl{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.bl .t{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.bar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px}
.alert{margin-bottom:14px}

/* Admin */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.stat h3{font-size:15px;margin-bottom:8px}
.stat .row{display:flex;gap:6px;flex-wrap:wrap}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form-row .field{flex:1;min-width:130px}
.msgbox{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:12px;font-size:14px;margin-top:10px}
code.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;font-weight:600}

.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kgrid .stat{display:flex;flex-direction:column;gap:2px}
.kgrid .big{font-family:var(--display);font-size:26px;font-weight:800}
.kgrid .sub{font-size:12px;color:var(--muted)}
@media (max-width:900px){.kgrid{grid-template-columns:1fr 1fr}}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.faq summary{font-weight:700;cursor:pointer}
.faq p{margin:8px 0 0;color:var(--muted);max-width:65ch}
.faq-more{color:var(--muted);font-size:14px}
.help-sec{padding-block:8px 56px;max-width:820px}
.top-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prov{font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:99px;padding:1px 8px}
.flag{display:inline-block;flex:none;vertical-align:middle;border-radius:3px}
.lp{position:relative}
.lp-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-weight:600}
.lp-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;z-index:40;min-width:190px;box-shadow:0 16px 40px -20px color-mix(in srgb,var(--fg) 45%,transparent);display:grid;gap:2px}
.lp-menu[hidden]{display:none}
.lp-menu button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;font-weight:600}
.lp-menu button:hover,.lp-menu button[aria-selected="true"]{background:var(--accent-soft)}
.panel .lp-menu{left:0;right:auto}
.langs{grid-template-columns:1fr 1fr}
.langs .fl{display:flex;align-items:center;gap:10px}
.btn.install{background:var(--go);border-color:var(--go);color:var(--go-fg);font-size:17px;padding:13px 24px;box-shadow:0 8px 20px -10px var(--go)}
.btn.install:hover{filter:brightness(1.08)}
.brand{text-decoration:none;color:var(--fg);gap:12px}
.brand .sticker{transform:rotate(-8deg);transition:transform .25s ease;flex:none}
.brand:hover .sticker{transform:rotate(4deg) scale(1.06)}
.brand .word{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1}
.brand .word span{color:var(--brand-text);text-shadow:0 1px 0 color-mix(in srgb,var(--fg) 35%,transparent)}
.titlebar .tb-brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;color:var(--fg);font-size:14px}
.titlebar .tb-brand span{color:var(--brand-text)}
.updbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--accent);color:var(--accent-fg);padding:10px 16px;font-weight:600}
.updbar .btn{background:var(--surface);color:var(--fg);border-color:var(--surface)}
.linkish{background:none;border:0;color:var(--accent);padding:0;font-weight:600;text-decoration:underline;cursor:pointer}
.loading{display:grid;place-items:center;padding:80px 16px;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 45%,transparent);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{background:var(--surface);border-radius:14px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal .card .row{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}.products,.steps{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}
  .side .who{width:100%}.side .spacer{display:none}.side hr{display:none}
  .aho,.admin-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}
  .addrow,.addrow.inc{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div id="updBar" class="updbar" hidden><span id="updTxt"></span><button class="btn small" id="updBtn"></button></div>
<main id="web" class="wrap"></main>
<main id="app" class="wrap" hidden></main>

function genCode(prefix){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c;
  do{const r=()=>Array.from({length:4},()=>A[crypto.getRandomValues(new Uint32Array(1))[0]%A.length]).join('');c=`${prefix}-${r()}-${r()}`}

function ahoData(){localData.aho=localData.aho||emptyAho();return localData.aho.months[curMonth]}
function screenAho(){
  const m=ahoData();const L=T[lang()]||T.en;
  const inc=m.inc.reduce((a,x)=>a+x.v,0), spent=m.exp.reduce((a,x)=>a+x.v,0), left=inc-spent;
  const byB=BLOCKS.map(b=>({...b,v:m.exp.filter(e=>e.b===b.id).reduce((a,x)=>a+x.v,0)}));
  const alerts=[];byB.forEach(b=>{if(!inc)return;const lim=inc*b.limit/100;if(b.v>lim)alerts.push(['bad',L.overMsg.replace('{b}',L.blocks[b.id])]);else if(b.v>lim*.85)alerts.push(['warn',L.nearMsg.replace('{b}',L.blocks[b.id])])});
  // anillo
  const R=62,C=2*Math.PI*R;let off=0;const total=Math.max(inc,spent)||1;
  const arcs=byB.filter(b=>b.v>0).map(b=>{const len=C*b.v/total;const s=`<circle cx="80" cy="80" r="${R}" fill="none" stroke="var(${b.color})" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len;return s}).join('');
  return `<div class="head"><div><h2>${esc(pname('aho'))}</h2><p>${esc(PRODUCTS[0].sub[lang()])}</p></div></div>
  <div class="months" role="group">${L.months.map((mm,i)=>`<button data-month="${i}" aria-pressed="${i===curMonth}">${mm}</button>`).join('')}</div>
  ${alerts.map(a=>`<div class="msg ${a[0]==='bad'?'err':'info'} alert">${a[1]}</div>`).join('')}
  <div class="aho">
    <div class="stack">
      <div class="box"><h3>${L.income}<span class="num">${eur(inc)}</span></h3>
        <div class="tbl-wrap"><table><tbody>${m.inc.map((x,i)=>`<tr><td>${esc(x.c)}</td><td class="r num">${eur(x.v)}</td><td class="r"><button class="x" data-del-inc="${i}" aria-label="Borrar">✕</button></td></tr>`).join('')}</tbody></table></div>
        <form class="addrow inc" id="incForm"><input id="inc-c" type="text" placeholder="${L.concept}"><input id="inc-v" type="number" step="0.01" min="0" placeholder="${L.amount}"><button class="btn small" type="submit">${L.add}</button></form>
      </div>
      <div class="box"><h3>${L.expenses}<span class="num">${eur(spent)}</span></h3>
        <div class="tbl-wrap"><table><thead><tr><th>${L.block}</th><th>${L.concept}</th><th class="r">${L.amount}</th><th></th></tr></thead>
        <tbody>${m.exp.map((x,i)=>{const b=BLOCKS.find(b=>b.id===x.b);return `<tr><td><span class="sw" style="background:var(${b.color})"></span>${L.blocks[x.b]}</td><td>${esc(x.c)}</td><td class="r num">${eur(x.v)}</td><td class="r"><button class="x" data-del-exp="${i}" aria-label="Borrar">✕</button></td></tr>`}).join('')}</tbody></table></div>
        <form class="addrow" id="expForm"><select id="exp-b">${BLOCKS.map(b=>`<option value="${b.id}">${L.blocks[b.id]}</option>`).join('')}</select><input id="exp-c" type="text" placeholder="${L.concept}"><input id="exp-v" type="number" step="0.01" min="0" placeholder="${L.amount}"><button class="btn small" type="submit">${L.add}</button></form>
      </div>
    </div>
    <div class="box"><h3>${L.summary}</h3>
      <div class="ring-wrap"><svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="${L.summary}"><circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${arcs}</svg>
        <div class="ring-center"><b class="num" style="color:${left<0?'var(--bad)':'var(--fg)'}">${eur(left)}</b><span>${L.left}</span></div></div>
      <div class="kpis"><div class="kpi"><span>${L.income}</span><b class="num">${eur(inc)}</b></div><div class="kpi"><span>${L.spent}</span><b class="num">${eur(spent)}</b></div></div>
      ${byB.map(b=>{const lim=inc*b.limit/100;const pct=lim?Math.min(100,b.v/lim*100):0;const st=!inc||b.v<=lim*.85?'ok':b.v<=lim?'warn':'bad';
        return `<div class="bl"><div class="t"><span><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(${b.color})"></span>${L.blocks[b.id]}</span><span class="num">${eur(b.v)} <span style="color:var(--muted)">/ ${eur(lim)}</span></span></div>
        <div class="bar"><i style="width:${pct}%;background:var(--${st==='ok'?b.color.slice(2):st})"></i></div></div>`}).join('')}
    </div>
  </div>`;
}

/* Ventas: cada código enviado/canjeado cuenta como una venta */
function feeCfg(){DB.fees=DB.fees||{price:9.99,etsyPct:10.5,etsyFix:0.48,webPct:5,webFix:0.46};return DB.fees}
function adminWait(){return DB.codesLoaded?'':'<div class="loading">Cargando datos…</div>'}
function saleFee(ch){const f=feeCfg();return ch==='web'?f.price*f.webPct/100+f.webFix:f.price*f.etsyPct/100+f.etsyFix}
function screenSales(){
  if(!DB.codesLoaded)return adminWait();
  const f=feeCfg();const sold=DB.codes.filter(c=>c.status!=='libre');
  const rows=PRODUCTS.map(p=>{const e=sold.filter(c=>c.prod===p.id&&chOf(c)==='etsy').length,w=sold.filter(c=>c.prod===p.id&&chOf(c)==='web').length;
    const gross=(e+w)*f.price,fees=e*saleFee('etsy')+w*saleFee('web');return {p,e,w,n:e+w,gross,fees,net:gross-fees}});
  const tot=rows.reduce((a,r)=>({e:a.e+r.e,w:a.w+r.w,n:a.n+r.n,gross:a.gross+r.gross,fees:a.fees+r.fees,net:a.net+r.net}),{e:0,w:0,n:0,gross:0,fees:0,net:0});
  const max=Math.max(1,...rows.map(r=>r.n));const E=v=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(v);
  const canjeados=DB.codes.filter(c=>c.status==='usado').length, pend=DB.codes.filter(c=>c.status==='enviado').length;
  return `<div class="head"><div><h2>Ventas</h2><p>Recuento por guía y canal. Cada código enviado o canjeado cuenta como una venta.</p></div></div>
  <div class="kgrid">
    <div class="stat"><span class="eyebrow">Ventas</span><b class="big num">${tot.n}</b><span class="sub">${tot.e} Etsy · ${tot.w} web</span></div>
    <div class="stat"><span class="eyebrow">Ingresos brutos</span><b class="big num">${E(tot.gross)}</b></div>
    <div class="stat"><span class="eyebrow">Comisiones</span><b class="big num" style="color:var(--bad)">−${E(tot.fees)}</b></div>
    <div class="stat"><span class="eyebrow">Neto</span><b class="big num" style="color:var(--ok)">${E(tot.net)}</b></div>
  </div>
  ${pend?`<div class="msg info" style="margin-bottom:16px">${pend} código(s) enviados que el cliente aún no ha canjeado. Si pasan varios días, escríbele por si necesita ayuda.</div>`:''}
  <div class="box" style="margin-bottom:18px"><h3>Por guía</h3><div class="tbl-wrap"><table>
    <thead><tr><th>Guía</th><th style="width:30%">Unidades</th><th class="r">Etsy</th><th class="r">Web</th><th class="r">Bruto</th><th class="r">Comisiones</th><th class="r">Neto</th></tr></thead>
    <tbody>${rows.sort((a,b)=>b.n-a.n).map(r=>`<tr><td><span class="sw" style="background:var(${r.p.color})"></span>${r.p.name.es}</td>
      <td><div class="bar"><i style="width:${r.n/max*100}%;background:var(${r.p.color})"></i></div>${r.n===0?'<span class="pill bad" style="margin-top:4px">Sin ventas</span>':''}</td>
      <td class="r num">${r.e}</td><td class="r num">${r.w}</td><td class="r num">${E(r.gross)}</td><td class="r num">−${E(r.fees)}</td><td class="r num"><b>${E(r.net)}</b></td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td class="r num"><b>${tot.e}</b></td><td class="r num"><b>${tot.w}</b></td><td class="r num"><b>${E(tot.gross)}</b></td><td class="r num"><b>−${E(tot.fees)}</b></td><td class="r num"><b>${E(tot.net)}</b></td></tr></tbody></table></div>
    <p style="color:var(--muted);font-size:13px;margin:10px 0 0">Por cada venta de ${E(f.price)} te quedan ${E(f.price-saleFee('etsy'))} en Etsy y ${E(f.price-saleFee('web'))} en la web. Canjeadas: ${canjeados}.</p></div>
  <form class="box" id="feeForm"><h3>Precio y comisiones</h3>
    <p style="color:var(--muted);font-size:13px;margin:0 0 10px">Valores aproximados. Revísalos con tus facturas reales de Etsy y Lemon Squeezy antes de lanzar.</p>
    <div class="form-row">
      <div class="field"><label for="f-price">Precio (€)</label><input id="f-price" type="number" step="0.01" value="${f.price}"></div>
      <div class="field"><label for="f-ep">Etsy %</label><input id="f-ep" type="number" step="0.1" value="${f.etsyPct}"></div>
      <div class="field"><label for="f-ef">Etsy fijo (€)</label><input id="f-ef" type="number" step="0.01" value="${f.etsyFix}"></div>
      <div class="field"><label for="f-wp">Web %</label><input id="f-wp" type="number" step="0.1" value="${f.webPct}"></div>
      <div class="field"><label for="f-wf">Web fijo (€)</label><input id="f-wf" type="number" step="0.01" value="${f.webFix}"></div>
      <button class="btn primary" type="submit">Guardar</button>
    </div></form>`;
}

const chOf=c=>c.ch||'etsy';
function webKey(){const h='0123456789ABCDEF',r=n=>Array.from({length:n},()=>h[Math.floor(Math.random()*16)]).join('');return `${r(8)}-${r(4)}-${r(4)}-${r(4)}`}

  const rows=DB.codes.filter(c=>(codeFilter==='all'||c.prod===codeFilter)&&(chFilter==='all'||chOf(c)===chFilter));
  const pill=s=>s==='libre'?'<span class="pill muted">Libre</span>':s==='enviado'?'<span class="pill warn">Enviado</span>':'<span class="pill ok">Usado</span>';
  return `<div class="head"><div><h2>Administración</h2><p>Solo visible para tu cuenta.</p></div></div>
  <div class="stats">${PRODUCTS.map(p=>{const cs=DB.codes.filter(c=>c.prod===p.id);const n=s=>cs.filter(c=>c.status===s).length;
    const e=cs.filter(c=>chOf(c)==='etsy'),w=cs.filter(c=>chOf(c)==='web');const ventas=x=>x.filter(c=>c.status!=='libre').length;

  <div class="admin-grid">
    <form class="box" id="assignForm"><h3>Nueva venta en Etsy</h3>
      <div class="form-row">
        <div class="field"><label for="as-prod">Guía</label><select id="as-prod">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name.es}</option>`).join('')}</select></div>
        <div class="field"><label for="as-order">Nº de pedido</label><input id="as-order" type="text" placeholder="3812447590"></div>
        <div class="field"><label for="as-lang">Idioma del mensaje</label><select id="as-lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:10px"><button class="btn primary" type="submit">Asignar código</button></div>
      <div id="assignOut">${lastAssigned?assignedHTML(lastAssigned):''}</div>
    </form>
    <form class="box" id="genForm"><h3>Generar códigos</h3>
      <div class="form-row">
        <div class="field"><label for="gen-prod">Guía</label><select id="gen-prod">${PRODUCTS.map(p=>`<option value="${p.id}">${p.name.es}</option>`).join('')}</select></div>
        <div class="field"><label for="gen-n">Cantidad</label><input id="gen-n" type="number" min="1" max="200" value="10"></div>
        <button class="btn" type="submit">Generar</button>
      </div>
      <p style="color:var(--muted);font-size:13px;margin:10px 0 0">Lista Etsy: códigos que generas tú y envías a mano. Los de la web no se generan aquí: los crea Lemon Squeezy en cada venta.</p>
    </form>
  </div>
  <div class="box"><h3>Códigos
    <select id="codeFilter" style="width:auto"><option value="all">Todas las guías</option>${PRODUCTS.map(p=>`<option value="${p.id}" ${codeFilter===p.id?'selected':''}>${p.name.es}</option>`).join('')}</select>
    <select id="chFilter" style="width:auto"><option value="all">Todos los canales</option><option value="etsy" ${chFilter==='etsy'?'selected':''}>Lista Etsy</option><option value="web" ${chFilter==='web'?'selected':''}>Lista web</option></select></h3>
    <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Canal</th><th>Guía</th><th>Estado</th><th>Pedido</th><th>Cuenta</th><th>Fecha</th></tr></thead>
    <tbody>${rows.map(c=>`<tr><td><code class="c">${c.code}</code></td><td>${chOf(c)==='web'?'<span class="pill ok">Web</span>':'<span class="pill muted">Etsy</span>'}</td><td>${pname(c.prod,'es')}</td><td>${pill(c.status)}</td><td class="num">${esc(c.order)}</td><td>${esc(c.userEmail||'')}</td><td class="num">${fmtDate(c.date)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}
function etsyMsg(code,prod,l){
  const n=pname(prod,l);
  if(l==='ca')return `Gràcies per la teva compra! 🎉\nEl teu codi d'activació de ${n} és: ${code}\n\n1. Descarrega l'app des de l'enllaç del PDF.\n2. Crea el teu compte.\n3. Prem «Activar» i enganxa el codi.\n\nEl codi és personal i només es pot fer servir una vegada.`;
  if(l==='en')return `Thank you for your purchase! 🎉\nYour ${n} activation code is: ${code}\n\n1. Download the app from the link in the PDF.\n2. Create your account.\n3. Tap "Activate" and paste the code.\n\nThe code is personal and can only be used once.`;
  return `¡Gracias por tu compra! 🎉\nTu código de activación de ${n} es: ${code}\n\n1. Descarga la app desde el enlace del PDF.\n2. Crea tu cuenta.\n3. Pulsa «Activar» y pega el código.\n\nEl código es personal y solo se puede usar una vez.`;
}
function assignedHTML(a){
  if(a.err)return `<div class="msg err" style="margin-top:10px">${a.err}</div>`;
  return `<div class="msg ok" style="margin-top:10px">Código <code class="c">${a.code}</code> asignado al pedido ${esc(a.order)}. Pégalo en Etsy → Pedidos → «Enviar mensaje al comprador».</div>
  <div class="msgbox" id="etsyMsg">${esc(etsyMsg(a.code,a.prod,a.lang))}</div>
  <div style="margin-top:8px"><button class="btn small" type="button" id="copyMsg">Copiar mensaje</button></div>`;
}

/* ---------- Render y eventos ---------- */
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function computeView(){const h=location.hash;view=(h==='#app'||(standalone()&&(h===''||h==='#')))?'app':'web'}
function render(){
  computeView();
  document.getElementById('web').hidden=view!=='web';document.getElementById('app').hidden=view!=='app';
  document.documentElement.lang=view==='web'?webLang():lang();
  if(view==='web')renderWeb();else renderApp();
}
window.addEventListener('hashchange',()=>{render();if(location.hash==='#app')window.scrollTo(0,0)});
function copyText(text,btn,label){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent=label||t('copied');setTimeout(()=>btn.textContent=o,1500)}};
  try{navigator.clipboard.writeText(text).then(done,()=>fallback())}catch(e){fallback()}
  function fallback(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()}
}
function infoModal(html){const m=document.getElementById('modal');m.innerHTML=`<div class="card">${html}<div class="row"><button class="btn primary" id="mOk">OK</button></div></div>`;m.hidden=false;m.querySelector('#mOk').onclick=()=>m.hidden=true}
function errMsg(e){const c=e&&e.code||'';
  if(c==='auth/email-already-in-use')return t('errExists');
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c))return t('errLogin');
  if(c==='auth/weak-password')return t('errShort');
  if(c==='auth/network-request-failed'||c==='unavailable')return t('netErr');
  console.error(e);return t('genErr');}

/* Instalación (PWA) */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
window.addEventListener('appinstalled',()=>{deferredPrompt=null});
async function doInstall(){
  if(standalone()){location.hash='#app';return}
  if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;if(r.outcome==='accepted')return;}
  infoModal(`<h3>${W('install')}</h3><p style="margin:0;color:var(--muted)">Chrome / Edge: pulsa el icono de instalar (⊕) a la derecha de la barra de direcciones, o menú ⋮ → «Instalar Lifezy».<br><br>Safari (Mac): menú Archivo → «Añadir al Dock».</p>`);
}

/* Actualizaciones (service worker) */
let waitingSW=null;
function showUpdate(sw){waitingSW=sw;const b=document.getElementById('updBar');document.getElementById('updTxt').textContent=t('newVersion');document.getElementById('updBtn').textContent=t('update');b.hidden=false}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate(nw)})});
    setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
  }).catch(()=>{});
  let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
}

document.addEventListener('click',async e=>{
  if(!e.target.closest('.lp'))document.querySelectorAll('.lp-menu').forEach(m=>m.hidden=true);
  const b=e.target.closest('button,[data-go]');if(!b)return;
  try{
  if(b.id==='updBtn'){if(waitingSW)waitingSW.postMessage('skipWaiting');return}
  if(b.dataset.install){doInstall();return}
  if(b.dataset.lp){const m=document.getElementById('lpm-'+b.dataset.lp);m.hidden=!m.hidden;b.setAttribute('aria-expanded',!m.hidden);return}
  if(b.dataset.setlang){const [id,l]=b.dataset.setlang.split(':');
    if(id==='web'){DB.webLang=l;store.set('lifezy-weblang',l)}
    else{DB.lang=l;store.set('lifezy-lang',l);if(fbUser&&profile){profile.lang=l;updateDoc(doc(db,'users',fbUser.uid),{lang:l}).catch(()=>{})}}
    render();return}
  if(b.dataset.gallery){openGallery(b.dataset.gallery);return}
  if(b.id==='galClose'){document.getElementById('modal').hidden=true;return}
  if(b.id==='galPrev'||b.id==='galNext'){const n=gallery(gal.id).length;openGallery(gal.id,(gal.i+(b.id==='galNext'?1:-1)+n)%n);return}
  if(b.dataset.buy){const p=PRODUCTS.find(x=>x.id===b.dataset.buy);infoModal(`<h3>${W('buy')} · ${p.name[webLang()]??p.name.en}</h3><p style="margin:0;color:var(--muted)">La compra en la web estará disponible muy pronto.</p>`);return}
  if(b.dataset.shop){location.hash='#guias';return}
  if(b.dataset.go==='app'){location.hash='#app';return}
  if(b.dataset.lang){DB.lang=b.dataset.lang;store.set('lifezy-lang',DB.lang);render();return}
  if(b.dataset.auth){authTab=b.dataset.auth;render();return}
  if(b.id==='forgot'){const email=document.getElementById('a-email').value.trim();const out=document.getElementById('authMsg');
    if(!email){out.innerHTML=`<div class="msg info">${t('needEmail')}</div>`;return}
    try{await sendPasswordResetEmail(auth,email)}catch(err){if(err.code==='auth/network-request-failed'){out.innerHTML=`<div class="msg err">${t('netErr')}</div>`;return}}
    out.innerHTML=`<div class="msg ok">${t('resetSent')}</div>`;return}
  if(b.dataset.screen){appScreen=b.dataset.screen;render();if((appScreen==='admin'||appScreen==='sales')&&user()?.admin&&!DB.codesLoaded){await loadAdminData();render()}return}
  if(b.id==='logout'){await signOut(auth);appScreen='catalog';return}
  if(b.dataset.month){curMonth=+b.dataset.month;render();return}
  if(b.dataset.delInc){localData.aho.months[curMonth].inc.splice(+b.dataset.delInc,1);save();render();return}
  if(b.dataset.delExp){localData.aho.months[curMonth].exp.splice(+b.dataset.delExp,1);save();render();return}
  if(b.id==='copyMsg'){copyText(document.getElementById('etsyMsg').textContent,b,'Copiado');return}
  if(b.id==='doExport'){
    const pack={app:'lifezy',version:1,created:new Date().toISOString(),email:fbUser.email,lang:lang(),data:localData};
    const name=`Lifezy_${new Date().toLocaleDateString('es-ES').replace(/\//g,'-')}.copia`;
    const blob=new Blob([JSON.stringify(pack)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    document.getElementById('bkArea').innerHTML=`<div class="msg ok" style="margin-top:12px">✓ ${esc(name)}</div>`;return}
  }catch(err){infoModal(`<p style="margin:0">${errMsg(err)}</p>`)}
});
document.addEventListener('input',e=>{if(e.target.id==='faqSearch'){const q=e.target.value.toLowerCase();document.querySelectorAll('.faq details').forEach(d=>{d.hidden=q&&!d.textContent.toLowerCase().includes(q)})}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='codeFilter'){codeFilter=el.value;render()}
  if(el.id==='chFilter'){chFilter=el.value;render()}
  if(el.id==='impFile'&&el.files[0]){const r=new FileReader();r.onload=()=>{const out=document.getElementById('bkArea');
    try{const p=JSON.parse(r.result);if(p.app!=='lifezy'||!p.data)throw 0;store.set(dataKey()+'-antes-de-importar',JSON.stringify(localData));localData=p.data;save();out.innerHTML=`<div class="msg ok" style="margin-top:12px">${t('importOk')}</div>`}
    catch(err){out.innerHTML=`<div class="msg err" style="margin-top:12px">${t('importBad')}</div>`}};r.readAsText(el.files[0])}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  try{
  if(f.id==='authForm'){
    const email=f.querySelector('#a-email').value.trim().toLowerCase(),pass=f.querySelector('#a-pass').value,remember=f.querySelector('#a-remember').checked;
    const out=f.querySelector('#authMsg');const err=m=>out.innerHTML=`<div class="msg err">${m}</div>`;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err(t('errEmail'));
    const btn=f.querySelector('button[type=submit]');btn.disabled=true;
    try{
      await setPersistence(auth,remember?browserLocalPersistence:browserSessionPersistence);
      if(authTab==='register'){
        if(pass.length<6){btn.disabled=false;return err(t('errShort'))}
        const name=f.querySelector('#a-name').value.trim()||email.split('@')[0];
        pendingProfile={email,name,lang:lang(),admin:false,unlocked:[],created:new Date().toISOString()};
        await createUserWithEmailAndPassword(auth,email,pass);
      }else{await signInWithEmailAndPassword(auth,email,pass)}
      appScreen='catalog';
    }catch(ex){btn.disabled=false;err(errMsg(ex))}
    return;
  }
  if(f.id==='actForm'){
    const code=f.querySelector('#act-code').value.trim().toUpperCase();const out=f.querySelector('#actMsg');
    if(!code)return;
    const ref=doc(db,'codes',code);const snap=await getDoc(ref);const u=user();
    if(!snap.exists()){out.innerHTML=`<div class="msg err">${t('codeBad')}</div>`;return}
    const c=snap.data();
    if(c.status==='usado'){out.innerHTML=`<div class="msg err">${t('codeUsed')}</div>`;return}
    if(u.unlocked.includes(c.prod)){out.innerHTML=`<div class="msg info">${t('codeOwned')}</div>`;return}
    const batch=writeBatch(db);
    batch.update(ref,{status:'usado',user:fbUser.uid,userEmail:fbUser.email,date:new Date().toISOString()});
    const upd={unlocked:[...u.unlocked,c.prod],lastCode:code};if(!profile.origin)upd.origin=c.ch||'etsy';
    batch.update(doc(db,'users',fbUser.uid),upd);
    await batch.commit();
    Object.assign(profile,upd);render();
    document.getElementById('actMsg').innerHTML=`<div class="msg ok">${t('codeOk').replace('{p}',pname(c.prod))}</div>`;return;
  }
  if(f.id==='incForm'){const c=f.querySelector('#inc-c').value.trim(),v=parseFloat(f.querySelector('#inc-v').value);if(!c||!(v>0))return;localData.aho.months[curMonth].inc.push({c,v});save();render();return}
  if(f.id==='expForm'){const c=f.querySelector('#exp-c').value.trim(),v=parseFloat(f.querySelector('#exp-v').value),bb=f.querySelector('#exp-b').value;if(!c||!(v>0))return;localData.aho.months[curMonth].exp.push({b:bb,c,v});save();render();const s=document.getElementById('exp-b');if(s)s.value=bb;return}
  if(f.id==='feeForm'){const g=id=>parseFloat(f.querySelector(id).value)||0;const fees={price:g('#f-price'),etsyPct:g('#f-ep'),etsyFix:g('#f-ef'),webPct:g('#f-wp'),webFix:g('#f-wf')};await setDoc(doc(db,'config','fees'),fees);DB.fees=fees;render();return}
  if(f.id==='genForm'){const p=PRODUCTS.find(x=>x.id===f.querySelector('#gen-prod').value);const n=Math.min(200,Math.max(1,+f.querySelector('#gen-n').value||1));
    const batch=writeBatch(db);const now=new Date().toISOString();
    for(let i=0;i<n;i++){const code=genCode(p.prefix);const c={prod:p.id,ch:'etsy',status:'libre',order:'',user:'',userEmail:'',date:'',created:now};batch.set(doc(db,'codes',code),c);DB.codes.unshift({code,...c})}
    await batch.commit();render();return}
  if(f.id==='assignForm'){const prod=f.querySelector('#as-prod').value,order=f.querySelector('#as-order').value.trim(),l=f.querySelector('#as-lang').value;
    if(!order){lastAssigned={err:'Escribe el nº de pedido de Etsy.'};render();return}
    if(DB.codes.some(c=>c.order===order&&c.prod===prod)){lastAssigned={err:`El pedido ${esc(order)} ya tiene un código de esta guía.`};render();return}
    const c=[...DB.codes].reverse().find(x=>x.prod===prod&&x.status==='libre'&&(x.ch||'etsy')==='etsy');
    if(!c){lastAssigned={err:'No quedan códigos libres de esta guía. Genera más.'};render();return}
    const upd={status:'enviado',order,date:new Date().toISOString()};await updateDoc(doc(db,'codes',c.code),upd);
    Object.assign(c,upd);lastAssigned={code:c.code,prod,order,lang:l};render();return}
  }catch(err){infoModal(`<p style="margin:0">${errMsg(err)}</p>`)}
});

/* ---------- Arranque ---------- */
let pendingProfile=null;
onAuthStateChanged(auth,async u=>{
  fbUser=u;profile=null;DB.codes=[];DB.codesLoaded=false;DB.fees=null;
  if(u){
    session=u.email;loadLocal();
    try{
      const ref=doc(db,'users',u.uid);let snap=await getDoc(ref);
      if(!snap.exists()){const p=pendingProfile||{email:u.email,name:u.email.split('@')[0],lang:lang(),admin:false,unlocked:[],created:new Date().toISOString()};await setDoc(ref,p);snap=await getDoc(ref)}
      profile=snap.data();pendingProfile=null;
      if(profile.lang){DB.lang=profile.lang;store.set('lifezy-lang',profile.lang)}
    }catch(e){console.error(e);profile={email:u.email,name:u.email.split('@')[0],unlocked:[],admin:false}}
  }else{session=null;localData=null}
  authReady=true;render();
});
render();
</script>
</body>
